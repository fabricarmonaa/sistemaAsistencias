<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - Sistema de Asistencias</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="main">
        <div class="contenedor-formulario">
            <div class="formulario">
                <div class="titulo">
                    <h2>Crear cuenta de <span>Preceptor</span></h2>
                </div>

                <h3>Registro</h3>

                <form id="registerForm">
                    <div class="section">
                        <label for="usuario">Usuario:</label>
                        <input type="text" id="usuario" name="usuario" placeholder="Usuario" required>
                    </div>

                    <div class="section">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" placeholder="correo@colegio.com" required>
                    </div>

                    <div class="section">
                        <label for="telefono">Teléfono:</label>
                        <input type="text" id="telefono" name="telefono" placeholder="Opcional">
                    </div>

                    <div class="section">
                        <label for="contrasena">Contraseña:</label>
                        <input type="password" id="contrasena" name="contrasena" placeholder="Mínimo 8 caracteres" required>
                    </div>

                    <button type="submit">Crear cuenta</button>
                </form>

                <div id="mensaje" class="mensaje" style="display: none;"></div>
                <p style="margin-top: 1rem;">¿Ya tenés usuario? <a href="/login.html">Iniciá sesión</a></p>
            </div>
        </div>
    </div>

    <script src="js/register.js"></script>
</body>
</html>
