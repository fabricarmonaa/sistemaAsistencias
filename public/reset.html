<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña - Sistema de Asistencias</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <meta name="theme-color" content="#1976d2">
    <link rel="stylesheet" href="css/auth-material.css">
</head>
<body>
    <div class="main">
        <div class="auth-card">
            <header class="auth-header">
                <span class="material-icons auth-icon">verified_user</span>
                <div class="auth-title">
                    <h2>Restablecer <span>contraseña</span></h2>
                    <p class="subtitle">Ingresá tu token</p>
                </div>
            </header>

            <form id="resetForm" class="auth-form" novalidate>
                <div class="input-group">
                    <span class="material-icons input-icon">vpn_key</span>
                    <input type="text" id="token" name="token" required placeholder=" ">
                    <label for="token">Token</label>
                </div>

                <div class="input-group">
                    <span class="material-icons input-icon">lock</span>
                    <input type="password" id="nueva" name="nueva" required placeholder=" ">
                    <label for="nueva">Nueva contraseña</label>
                </div>

                <button type="submit" class="btn-primary">Actualizar contraseña</button>
                <div id="mensaje" class="mensaje" aria-live="polite" style="display: none;"></div>

                <div class="aux-links">
                    <a href="/forgot">¿No tenés token? Solicitalo</a>
                    <a href="/login.html">¿Recordaste tu clave? Volver al login</a>
                </div>
            </form>
        </div>
    </div>

    <script src="js/reset.js"></script>
</body>
</html>
