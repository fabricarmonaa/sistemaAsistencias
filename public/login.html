<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Asistencias - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <meta name="theme-color" content="#1976d2">
    <link rel="stylesheet" href="css/auth-material.css">
</head>
<body>
    <div class="main">
        <div class="auth-card">
            <div class="brand-logo">
                <div class="logo-mark">SA</div>
                <div class="brand-text">Sistema de Asistencias</div>
            </div>
            <header class="auth-header">
                <span class="material-icons auth-icon">badge</span>
                <div class="auth-title">
                    <h2>Sistema de <span>Asistencias</span></h2>
                    <p class="subtitle">Iniciar sesión</p>
                </div>
            </header>

            <form id="loginForm" class="auth-form" novalidate>
                <div class="input-group">
                    <span class="material-icons input-icon">person</span>
                    <input type="text" id="usuario" name="usuario" required autocomplete="username" placeholder=" ">
                    <label for="usuario">Usuario</label>
                </div>

                <div class="input-group">
                    <span class="material-icons input-icon">lock</span>
                    <input type="password" id="contrasena" name="contrasena" required autocomplete="current-password" placeholder=" ">
                    <label for="contrasena">Contraseña</label>
                </div>

                <button type="submit" class="btn-primary">Ingresar</button>
                <div id="mensaje" class="mensaje" aria-live="polite" style="display: none;"></div>

                <div class="aux-links">
                    <a href="/register">¿No tenés cuenta? Registrate</a>
                    <div class="forgot-link"><a href="/forgot">¿Olvidaste tu contraseña?</a></div>
                </div>
            </form>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
